<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Malgun Gothic, Pretendard, sans-serif"><rect width="860" height="440" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#0b0b0b">분쟁은 신청의 6%지만, 매출로는 출원과 맞먹는다</text><text x="24" y="56" font-size="13" fill="#52514e">왼쪽: 신청 2,141건의 분류 비중 · 오른쪽: 연 평균 신청 × 수임률 10~20% × 수수료(출원 300만, 분쟁 2,000만)의 중간값 비중</text><rect x="180" y="90" width="160" height="262.2" rx="3" fill="#2a78d6"/><rect x="180" y="354.2" width="160" height="15.8" rx="3" fill="#eb6834"/><text x="260" y="227.6" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">출원 94%</text><text x="260" y="367.59999999999997" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle"></text><text x="350" y="366.59999999999997" font-size="14" font-weight="700" fill="#0b0b0b">분쟁 6%</text><text x="260" y="392" font-size="13" fill="#52514e" text-anchor="middle">신청 건수 (12년)</text><rect x="540" y="90" width="160" height="127.80000000000001" rx="3" fill="#2a78d6"/><rect x="540" y="219.8" width="160" height="150.2" rx="3" fill="#eb6834"/><text x="620" y="160.4" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">출원 46%</text><text x="620" y="300.4" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">분쟁 54%</text><text x="620" y="392" font-size="13" fill="#52514e" text-anchor="middle">연 매출 추정</text><text x="440" y="230" font-size="22" fill="#52514e" text-anchor="middle">→</text><text x="440" y="254" font-size="12" fill="#52514e" text-anchor="middle">수수료 7배</text><text x="836" y="428" font-size="11" fill="#52514e" text-anchor="end">출처: 게시판 분류, 변리사 답. 분쟁 전환율이 출원과 같다는 가정</text></svg>