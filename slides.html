<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 슬라이드</title>
<style>
  :root { --bg: #111; --fg: #f2f2f2; --mute: #9a9a9a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Malgun Gothic", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #stage img { max-width: 100vw; max-height: 100vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; background: rgba(0,0,0,.6); font-size: 14px; transition: opacity .3s; }
  #bar button { background: #2a78d6; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  #bar .ghost { background: #333; }
  #n { color: var(--mute); min-width: 48px; text-align: center; }
  body.fs #bar { opacity: 0; }
  body.fs #bar:hover { opacity: 1; }
  #hint { color: var(--mute); }
  @media (max-width: 600px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="stage"><img id="img" alt="슬라이드"></div>
<div id="bar">
  <button class="ghost" id="prev">◀ 이전</button>
  <span id="n"></span>
  <button class="ghost" id="next">다음 ▶</button>
  <button id="full">전체 화면</button>
  <span id="hint">클릭·→·스페이스: 다음 &nbsp; ←: 이전 &nbsp; F: 전체 화면</span>
</div>
<script>
  const N = 5;
  const srcs = Array.from({ length: N }, (_, i) => `slides/s${i + 1}.png`);
  srcs.forEach((s) => { const im = new Image(); im.src = s; }); // 미리 불러오기
  let i = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), N) - 1;
  const img = document.getElementById('img'), n = document.getElementById('n');
  const show = () => { img.src = srcs[i]; img.alt = `슬라이드 ${i + 1}`; n.textContent = `${i + 1} / ${N}`; history.replaceState(null, '', `#${i + 1}`); };
  const go = (d) => { i = Math.min(Math.max(i + d, 0), N - 1); show(); };
  const full = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
  document.getElementById('prev').onclick = (e) => { e.stopPropagation(); go(-1); };
  document.getElementById('next').onclick = (e) => { e.stopPropagation(); go(1); };
  document.getElementById('full').onclick = (e) => { e.stopPropagation(); full(); };
  document.getElementById('stage').onclick = (e) => go(e.clientX < innerWidth * 0.25 ? -1 : 1);
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') { i = 0; show(); }
    else if (e.key === 'End') { i = N - 1; show(); }
    else if (e.key === 'f' || e.key === 'F') full();
  });
  document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));
  let x0 = null;
  addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); x0 = null; });
  show();
</script>
</body>
</html>
