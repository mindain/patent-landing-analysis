<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Malgun Gothic, Pretendard, sans-serif"><rect width="860" height="440" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#0b0b0b">광고 100번 눌리면 4명이 신청하고, 수임은 1건이 안 된다</text><text x="24" y="56" font-size="13" fill="#52514e">90일 (2026-07-06 ~ 10-03). 전화 문의는 폼 신청만큼 더 있으나 기록이 없음</text><rect x="40" y="120" width="170" height="150" rx="8" fill="#2a78d6" opacity="1"/><text x="125" y="170" font-size="14" fill="#fff" text-anchor="middle">광고 노출</text><text x="125" y="220" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">195,455</text><rect x="246" y="120" width="170" height="150" rx="8" fill="#2a78d6" opacity="0.88"/><text x="331" y="170" font-size="14" fill="#fff" text-anchor="middle">클릭 = 방문</text><text x="331" y="220" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">388</text><text x="228" y="190" font-size="12" fill="#52514e" text-anchor="middle">→</text><text x="228" y="208" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">0.2%</text><rect x="452" y="120" width="170" height="150" rx="8" fill="#eb6834" opacity="0.76"/><text x="537" y="170" font-size="14" fill="#fff" text-anchor="middle">폼 신청</text><text x="537" y="220" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">15</text><text x="434" y="190" font-size="12" fill="#52514e" text-anchor="middle">→</text><text x="434" y="208" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">3.9%</text><rect x="658" y="120" width="170" height="150" rx="8" fill="#2a78d6" opacity="0.64"/><text x="743" y="170" font-size="14" fill="#fff" text-anchor="middle">수임 추정</text><text x="743" y="220" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">1.5~3</text><text x="640" y="190" font-size="12" fill="#52514e" text-anchor="middle">→</text><text x="640" y="208" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">10~20%</text><text x="40" y="320" font-size="13" fill="#0b0b0b">광고비 733,728원 → 수임 1건당 24만~49만 원 (신청이 모두 광고로 왔을 때). 광고로 온 신청이 절반뿐이어도 49만~98만 원</text><text x="40" y="344" font-size="13" fill="#0b0b0b">출원 수수료 300만 원의 8~33%. 어느 경우든 광고는 남는다 → 리뉴얼의 목표는 광고비 절감이 아니라 같은 388명에서 신청을 늘리는 것</text><text x="836" y="428" font-size="11" fill="#52514e" text-anchor="end">출처: 네이버 광고 보고서, 게시판, 변리사 답(전환율·수수료)</text></svg>